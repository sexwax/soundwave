name = "soundwave-cors-proxy"
main = "cloudflare-worker.js"
compatibility_date = "2024-01-01"

# Comma-separated, no spaces needed — must match the origin(s) SoundWave is
# served from exactly (scheme + host + port). Edit before deploying, or
# override per-environment with `wrangler secret put ALLOWED_ORIGINS`.
[vars]
ALLOWED_ORIGINS = "https://soundwave.example.com,http://localhost:5173"
